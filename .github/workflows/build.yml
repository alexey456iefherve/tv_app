name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Разворачиваем Python 3.14, чтобы удовлетворить требование hostpython3 == 3.14.2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.0-alpha.2' # Устанавливает базовую ветку 3.14.x

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libsqlite3-dev libgdbm-dev libssl-dev \
            libbz2-dev libffi-dev liblzma-dev libasound2-dev shared-mime-info

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          # Устанавливаем Cython, поддерживающий новые версии Python
          pip install Cython virtualenv buildozer

      - name: Build Android APK
        run: |
          rm -rf .buildozer
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 1
