name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Исправленный официальный экшен для сборки
      - name: Build APK with Buildozer
        uses: alexey456iefherve/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      # Сохранение готового APK-файла в артефакты
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-App-APK
          path: ${{ steps.buildozer.outputs.filename }}
