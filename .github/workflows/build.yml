name: Build Kivy APK

on:
  push:
    branches: [ main ] # Замените на вашу ветку по умолчанию (например, master)
  workflow_dispatch:   # Позволяет запускать сборку вручную через сайт GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildozer Action автоматически установит Python, SDK/NDK и соберет APK
      - name: Build APK with Buildozer
        uses: ArtemGovorov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      # Сохранение готового APK-файла в артефакты сборки
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-App-APK
          path: ${{ steps.buildozer.outputs.filename }}
