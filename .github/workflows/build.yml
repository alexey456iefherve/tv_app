name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Обновлено с @v4 до @v4.2.2 (поддержка Node 24)
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Обновлено с @v5 до @v5.4.0
      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11.9'

      # Обновлено с @v4 до @v5.5.0
      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libsqlite3-dev libgdbm-dev libssl-dev \
            libbz2-dev libffi-dev liblzma-dev libasound2-dev shared-mime-info

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 virtualenv buildozer

      - name: Build Android APK
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          yes | buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 1
